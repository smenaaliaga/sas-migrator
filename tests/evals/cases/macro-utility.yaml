id: macro-utility
strategy: python
placement: utility
node_label: Parámetros de periodo
sas_code: |
  %let periodo = 202601;
  %macro ultimo_dia(anio, mes);
    %sysfunc(day(%sysfunc(intnx(month, %sysfunc(mdy(&mes,1,&anio)), 0, e))))
