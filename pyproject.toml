[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sas-migrator"
version = "2.0.0a0"
description = "SAS EG to Python migration pipeline — LangGraph orchestration over a deterministic core"
requires-python = ">=3.11"
# Pisos verificados con techo de major: un major nuevo de pandas/pydantic/
# langgraph cambia semántica — que la actualización sea una decisión, no un
# `pip install -U` accidental. Verificado contra pandas 3.x / pydantic 2.13 /
# langgraph 1.2 (los instalados en el venv de desarrollo y CI).
dependencies = [
    "pandas>=2.2,<4",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.20,<5",
    "openpyxl>=3.1,<4",
    "nbformat>=5.9,<6",
    "rapidfuzz>=3.0,<4",
]

[project.optional-dependencies]
graph = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
]
llm = [
    "anthropic>=0.75",
    "python-dotenv>=1.0",
]
db = [
    "sqlalchemy>=2.0",
    "pyodbc>=5.0",
]
# Requisito de la fase 7 (ejecución de notebooks tras la pausa sagrada):
# nbclient ejecuta, ipykernel es el kernel que nbclient lanza. jupytext y
# papermill salieron: nadie los importaba (la celda `parameters` usa la
# CONVENCIÓN de papermill, no el paquete).
notebook = [
    "nbclient>=0.10,<1",
    "ipykernel>=6.29,<10",
]
cli = [
    "typer>=0.12",
]
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]

[project.scripts]
sas-migrator = "sas_migrator.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sas_migrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E701/E702/E731/E741/UP042/B007: estilo legado del port v1 — endurecer al tocar cada módulo.
ignore = ["E501", "E701", "E702", "E731", "E741", "UP042", "B007"]

[tool.ruff.lint.per-file-ignores]
# B008 (llamadas en defaults) es el patrón idiomático de typer.Option.
"src/sas_migrator/cli/*" = ["B008"]
