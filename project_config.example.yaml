# Configuración de proyecto — copiar como project_config.yaml en la raíz del
# workspace de migración y completar. Todo lo específico del cliente/entorno
# vive aquí; el código del migrador no trae ningún default de infraestructura.

db:
  # Servidor SQL Server usado cuando una conexión de db_connections.yaml no
  # declara el suyo. Sin este valor y sin server en la conexión, conectar
  # falla con error explícito.
  default_server: ""
  default_port: 1433
  default_driver: "ODBC Driver 17 for SQL Server"
  # Confiar en el certificado del servidor sin validarlo (opt-in consciente).
  trust_server_certificate: false

audit:
  # Los endpoints que el flujo consulta y las tablas que puebla NO se declaran
  # acá: la auditoría los lee del propio SAS (el URL= del PROC HTTP y el destino
  # de PROC APPEND/INSERT/CREATE TABLE). Las reglas de deriva —el traductor
  # cambió el endpoint, o reemplazó la llamada a la API por un SELECT de la
  # tabla que esa API debía poblar— corren solas, sin configurar nada.
  #
  # Acá va solo lo que el SAS no dice:
  # Formas de manejar secretos que aceptas donde el SAS usaba &user/&password.
  env_secret_markers: ["os.environ", "dotenv"]
  # DataFrames cuya inicialización debe verificarse en runtime.
  runtime_df_checks: []

llm:
  # Backend de Claude: "anthropic" (API directa) o "foundry" (Azure AI Foundry).
  provider: "anthropic"
  model: "claude-opus-5"
  max_tokens: 16000
  # Tope de salida por tarea (translate, verify, analysis_reviews, matching,
  # docs, mismatch_diagnosis). Ausente la clave, rige max_tokens.
  max_tokens_by_task: {}
  #  translation: 32000
  max_validation_retries: 3
  # Solo con provider=foundry: el <resource> de
  # https://<resource>.services.ai.azure.com — infraestructura, no secreto.
  foundry_resource: ""
  # Las API keys NO van acá (este archivo se commitea): van en .env o en el
  # entorno — ANTHROPIC_API_KEY / ANTHROPIC_FOUNDRY_API_KEY. Ver .env.example.

translation:
  # Librerías de terceros que las traducciones pueden importar (además de la
  # stdlib). Es el contrato del entorno DESTINO de los notebooks — el
  # ensamblador emite output/requirements.txt con las que se usan de verdad.
  # Agregar acá una librería del cliente la habilita en el chequeo estático y
  # se la anuncia al traductor en el prompt.
  allowed_imports:
    - matplotlib
    - numpy
    - openpyxl
    - pandas
    - pyreadstat
    - requests
    - scipy
    - sqlalchemy
  # Verificador LLM post-chequeo estático (fase 6): compara SAS vs traducción
  # buscando semántica perdida o cambiada. all = todos los nodos (default),
  # low = solo los de confianza baja, off = sin verificador.
  verify: all
  # Logging liviano por celda: `_log(...)` al final de las celdas con
  # resultados importantes + persistencia en output/log/<notebook>.log.
  # Este flag es solo la recomendación de la tarjeta B5b de la entrevista;
  # la decisión final la toma el usuario ahí.
  cell_logging: false

run:
  # Valores de las variables macro que el SAS heredaba del entorno (autoexec
  # del servidor, prompts de EG) y que el .egp por lo tanto no define —
  # típicamente el período de la corrida. Suben a la celda `parameters` de
  # cada notebook que las use. Sin valor, el notebook falla al ejecutar
  # diciendo cuál falta, en vez de correr con un período equivocado.
  # Las credenciales (&user, &password) NO van acá: van a os.environ.
  macro_params: {}
  #  ANIO: 2024
  #  TRIM: 4

parser:
  # Engines de BD adicionales a reconocer en LIBNAME (alias custom del
  # cliente que no están en la lista default de SAS/ACCESS).
  # Ejemplo: ["ODBCLOAD", "MIENGINE"]
  extra_db_engines: []
  # Engines a excluir del set default (p. ej. uno que el cliente usa para
  # rutas de archivos y no debe clasificar como BD).
  ignore_db_engines: []
