name: Nightly

# Suite lenta (Etapa 6): evals live contra el LLM real y, si el repo tiene un
# .egp de integración configurado, el harness real. No corre por push — corre
# de madrugada o a mano. Requiere el secret ANTHROPIC_API_KEY; sin él, los
# tests live se saltan y el run solo confirma la suite rápida.

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC diario
  workflow_dispatch:
    inputs:
      real_egp:
        description: "Ruta (dentro del repo) a un .egp de integración"
        required: false
        default: ""

jobs:
  nightly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (con extra llm)
        run: python -m pip install -e ".[dev,graph,cli,mcp,db,notebook,llm]"
      - name: Suite completa
        run: python -m pytest tests/ -q --basetemp=.pytest_tmp
      - name: Evals live
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest tests/evals -q --basetemp=.pytest_tmp
      - name: Harness .egp real
        if: github.event.inputs.real_egp != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SASMIG_REAL_EGP: ${{ github.event.inputs.real_egp }}
          SASMIG_REAL_EGP_REPORT: real_egp_backlog.json
        run: python -m pytest tests/integration -q --basetemp=.pytest_tmp
      - name: Publicar backlog del .egp real
        if: github.event.inputs.real_egp != ''
        uses: actions/upload-artifact@v4
        with:
          name: real-egp-backlog
          path: real_egp_backlog.json
          if-no-files-found: ignore
