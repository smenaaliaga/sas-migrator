name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,graph,cli]"
      - name: Lint
        run: python -m ruff check src/ tests/
      - name: Tests
        run: python -m pytest tests/ -q --basetemp=.pytest_tmp
